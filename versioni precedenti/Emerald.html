<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emerald Gioielleria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@300&display=swap" rel="stylesheet">

  <style>
    body { background:black; color:white; font-family:'Montserrat', sans-serif; cursor:none; }

    .navbar { background: transparent; margin-top: 15px; }
    .navbar-toggler { border: none; }

    .navbar-toggler-icon {
      background-image: none;
      width: 28px;
      height: 2px;
      background: linear-gradient(90deg,#d4af37,#fff8dc);
      position: relative;
      display: block;
      transition: 0.3s;
    }

    .navbar-toggler-icon::before,
    .navbar-toggler-icon::after {
      content: '';
      position: absolute;
      width: 28px;
      height: 2px;
      background: linear-gradient(90deg,#d4af37,#fff8dc);
      left: 0;
      transition: 0.3s;
    }

    .navbar-toggler-icon::before { top: -7px; }
    .navbar-toggler-icon::after { top: 7px; }

    .navbar-collapse {
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      margin-top: 15px;
      box-shadow: 0 0 30px rgba(212,175,55,0.2);
    }

    .nav-link {
      color: white !important;
      opacity: 0.7;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 10px 0;
      transition: 0.3s;
    }

    .nav-link:hover {
      opacity: 1;
      color: #d4af37 !important;
      transform: translateX(5px);
    }

    .title {
      text-align:center;
      font-family:'Cinzel', serif;
      font-size:5rem;
      letter-spacing:10px;
      margin:20px 0 0 0;
      background:linear-gradient(90deg,#d4af37,#fff8dc,#d4af37);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .subtitle {
      text-align:center;
      font-size:1.1rem;
      font-style:italic;
      margin-top:6px;
      color:#d4af37;
      opacity:0.85;
      letter-spacing:3px;
      font-family:'Cinzel', serif;
    }

    .gold-bar {
      height:3px;
      width:100%;
      background: linear-gradient(90deg, transparent, gold, transparent);
      background-size: 200% 100%;
      animation: goldMove 8s linear infinite;
    }

    @keyframes goldMove {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .hero-wrapper {
      margin:40px auto;
      max-width:1100px;
      border-radius:30px;
      overflow:hidden;
      box-shadow: 0 0 30px rgba(212,175,55,0.25), 0 0 60px rgba(212,175,55,0.15);
    }

    .hero img {
      height:500px;
      object-fit:cover;
      filter:brightness(0.75);
    }

    .cursor-light {
      position:fixed;
      width:300px;
      height:300px;
      background:radial-gradient(circle, rgba(255,255,200,0.25), transparent 70%);
      border-radius:50%;
      pointer-events:none;
      transform:translate(-50%,-50%);
      z-index:9999;
    }

    .section { padding:80px 0; }

    .showcase { height:420px; display:flex; justify-content:center; align-items:center; }

    .showcase img {
      max-height:280px;
      border-radius:20px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .showcase img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 40px rgba(212,175,55,0.3);
    }

    .card {
      background:#111;
      border:none;
      border-radius:20px;
      overflow:hidden;
      transition:0.3s;
    }

    .card:hover {
      transform:translateY(-10px);
      box-shadow:0 10px 30px rgba(212,175,55,0.3);
    }

    .card img { height:220px; object-fit:cover; }

    footer {
      background:#0a0a0a;
      padding:40px;
      text-align:center;
      margin-top:60px;
      border-top:1px solid rgba(212,175,55,0.2);
    }

    .carousel-indicators [data-bs-target] { background-color:gold; }
  </style>
</head>
<body>

<div class="cursor-light" id="cursorLight"></div>

<nav class="navbar navbar-dark">
  <div class="container-fluid">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Collezioni</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Chi siamo</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contatti</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="title">EMERALD</div>
<div class="subtitle"><em>Gioielli</em></div>
<div class="gold-bar"></div>

<!-- HERO -->
<div class="hero-wrapper">
  <div id="heroCarousel" class="carousel slide hero" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active"><img src="immagine.png" class="d-block w-100"></div>
      <div class="carousel-item"><img src="immagine2.png" class="d-block w-100"></div>
      <div class="carousel-item"><img src="immagine3.png" class="d-block w-100"></div>
    </div>
  </div>
</div>

<!-- VETRINA CON FRECCE RIPRISTINATE -->
<div class="container section">
  <div id="productCarousel" class="carousel slide">

    <div class="carousel-inner">
      <div class="carousel-item active"><div class="showcase"><img src="immagine6.jpg"></div></div>
      <div class="carousel-item"><div class="showcase"><img src="immagine8.jpg"></div></div>
      <div class="carousel-item"><div class="showcase"><img src="immagine9.jpg"></div></div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>

  </div>
</div>

<!-- GALLERIA -->
<div class="container section">
  <div class="row g-4">
    <div class="col-md-4"><img class="img-fluid rounded" src="immagine10.jpg"></div>
    <div class="col-md-4"><img class="img-fluid rounded" src="immagine5.jpg"></div>
    <div class="col-md-4"><img class="img-fluid rounded" src="immagine7.jpg"></div>
  </div>
</div>

<!-- PRODOTTI -->
<div class="container section">
  <div class="row g-4">
    <div class="col-md-3"><div class="card"><img src="immagine.png"><div class="p-3 text-center">Anello</div></div></div>
    <div class="col-md-3"><div class="card"><img src="immagine2.png"><div class="p-3 text-center">Collana</div></div></div>
    <div class="col-md-3"><div class="card"><img src="immagine3.png"><div class="p-3 text-center">Bracciale</div></div></div>
    <div class="col-md-3"><div class="card"><img src="immagine1.png"><div class="p-3 text-center">Orologi</div></div></div>
  </div>
</div>

<footer>
  <h5>Emerald Gioielleria</h5>
  <p>Eleganza senza tempo</p>
</footer>

<script>
const cursorLight = document.getElementById('cursorLight');
document.addEventListener('mousemove', (e) => {
  cursorLight.style.left = e.clientX + 'px';
  cursorLight.style.top = e.clientY + 'px';
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
