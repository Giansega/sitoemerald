<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emerald Gioielleria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@300&display=swap" rel="stylesheet">

  <style>
    body { background:black; color:white; font-family:'Montserrat', sans-serif; cursor:none; overflow-x: hidden; }

    /* --- CURSORE LUMINOSO --- */
    .cursor-light {
      position:fixed; width:300px; height:300px;
      background:radial-gradient(circle, rgba(212,175,55,0.15), transparent 70%);
      border-radius:50%; pointer-events:none; transform:translate(-50%,-50%); z-index:9999;
    }

    /* --- HEADER & NAV --- */
    .navbar { background: transparent; padding: 20px; }
    .title {
      text-align:center; font-family:'Cinzel', serif; font-size:4.5rem; letter-spacing:12px;
      background:linear-gradient(90deg,#d4af37,#fff8dc,#d4af37);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .gold-bar {
      height:2px; width:100%; background: linear-gradient(90deg, transparent, #d4af37, transparent);
      margin-bottom: 40px;
    }

    /* --- SEZIONE 1: BANNER HERO --- */
    .hero-banner {
      width: 100%; height: 60vh; border-radius: 0; overflow: hidden;
      margin-bottom: 60px; border-bottom: 1px solid rgba(212,175,55,0.3);
    }
    .hero-banner img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); }

    /* --- SEZIONE 2: VETRINA (Carousel con Animazione) --- */
    .vetrina-container { padding: 60px 0; background: rgba(10,10,10,0.5); }
    .carousel-item { transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.9s ease; }
    .carousel-item-next, .carousel-item-prev, .carousel-item.active { display: flex; justify-content: center; }
    
    .showcase-img {
      max-height: 400px; border-radius: 15px;
      transform: scale(0.8); opacity: 0; transition: 0.8s all;
      box-shadow: 0 0 40px rgba(212,175,55,0.1);
    }
    .active .showcase-img { transform: scale(1); opacity: 1; }

    /* --- SEZIONE 3: CARDS PRODOTTI --- */
    .card { background:#111; border: 1px solid #222; border-radius:15px; overflow:hidden; transition:0.4s; }
    .card:hover { transform:translateY(-10px); border-color: #d4af37; }
    .card img { height:250px; object-fit:cover; }

    /* --- SEZIONE 4: RETTANGOLI STONDATI --- */
    .stondato-box {
      background: linear-gradient(145deg, #0f0f0f, #1a1a1a);
      border: 1px solid rgba(212,175,55,0.2);
      border-radius: 40px; /* Bordo stondato rettangolare */
      padding: 30px;
      display: flex;
      align-items: center;
      gap: 25px;
      height: 100%;
      transition: 0.3s;
    }
    .stondato-box:hover { border-color: #d4af37; box-shadow: 0 0 25px rgba(212,175,55,0.1); }
    
    .mini-slider { width: 120px; height: 120px; flex-shrink: 0; border-radius: 20px; overflow: hidden; border: 1px solid #d4af37; }
    .mini-slider img { width: 100%; height: 100%; object-fit: cover; }

    footer { padding: 50px; text-align: center; border-top: 1px solid #222; margin-top: 80px; color: #d4af37; }
  </style>
</head>
<body>

<div class="cursor-light" id="cursorLight"></div>

<!-- HEADER -->
<div class="container-fluid">
    <div class="title mt-4">EMERALD</div>
    <div class="text-center mb-2" style="letter-spacing: 5px; color: #d4af37;">BOUTIQUE</div>
    <div class="gold-bar"></div>
</div>

<!-- SEZIONE 1: BANNER FOTO -->
<div class="hero-banner">
  <div id="bannerFade" class="carousel slide carousel-fade" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active"><img src="immagine.png" alt="Banner 1"></div>
      <div class="carousel-item"><img src="immagine2.png" alt="Banner 2"></div>
    </div>
  </div>
</div>

<!-- SEZIONE 2: VETRINA ANIMATA -->
<div class="vetrina-container">
  <div class="container">
    <h2 class="text-center mb-5" style="font-family: 'Cinzel'; color: #d4af37;">Pezzi Esclusivi</h2>
    <div id="vetrinaCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active"><img src="immagine6.jpg" class="showcase-img"></div>
        <div class="carousel-item"><img src="immagine8.jpg" class="showcase-img"></div>
        <div class="carousel-item"><img src="immagine9.jpg" class="showcase-img"></div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#vetrinaCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#vetrinaCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </div>
</div>

<!-- SEZIONE 3: CARD PRODOTTI -->
<div class="container py-5">
  <div class="row g-4">
    <div class="col-md-3"><div class="card"><img src="immagine.png"><div class="p-3 text-center">Anelli</div></div></div>
    <div class="col-md-3"><div class="card"><img src="immagine2.png"><div class="p-3 text-center">Collane</div></div></div>
    <div class="col-md-3"><div class="card"><img src="immagine3.png"><div class="p-3 text-center">Bracciali</div></div></div>
    <div class="col-md-3"><div class="card"><img src="immagine1.png"><div class="p-3 text-center">Orologi</div></div></div>
  </div>
</div>

<!-- SEZIONE 4: RETTANGOLI STONDATI CON DESCRIZIONE E MINI SLIDE -->
<div class="container py-5">
  <div class="row g-4">
    <!-- Box 1 -->
    <div class="col-md-6">
      <div class="stondato-box">
        <div id="miniSlide1" class="carousel slide mini-slider" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active"><img src="immagine10.jpg"></div>
            <div class="carousel-item"><img src="immagine5.jpg"></div>
          </div>
        </div>
        <div>
          <h4 style="font-family: 'Cinzel'; color: gold;">Design Italiano</h4>
          <p class="small m-0 opacity-75">Linee moderne che incontrano la tradizione orafa più pura.</p>
        </div>
      </div>
    </div>
    <!-- Box 2 -->
    <div class="col-md-6">
      <div class="stondato-box">
        <div id="miniSlide2" class="carousel slide mini-slider" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active"><img src="immagine7.jpg"></div>
            <div class="carousel-item"><img src="immagine3.png"></div>
          </div>
        </div>
        <div>
          <h4 style="font-family: 'Cinzel'; color: gold;">Qualità Certificata</h4>
          <p class="small m-0 opacity-75">Ogni diamante è accompagnato da certificazione internazionale GIA.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>
  <p style="font-family: 'Cinzel'; font-size: 1.2rem;">Emerald Gioielleria</p>
  <small>Via del Lusso, Milano | © 2026</small>
</footer>

<script>
    const cursorLight = document.getElementById('cursorLight');
    document.addEventListener('mousemove', (e) => {
      cursorLight.style.left = e.clientX + 'px';
      cursorLight.style.top = e.clientY + 'px';
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
